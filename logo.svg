<svg width="160" height="40" viewBox="0 0 160 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hexagon symbol - simplified and compact -->
  <g id="hexagons" transform="translate(5, 5)">
    <!-- Main center hexagon -->
    <path d="M 12 6 L 18 3 L 24 6 L 24 14 L 18 17 L 12 14 Z" stroke="#050990" stroke-width="1" fill="none"/>
    
    <!-- Left hexagon -->
    <path d="M 6 11 L 11 8 L 16 11 L 16 18 L 11 21 L 6 18 Z" stroke="#050990" stroke-width="1" fill="none"/>
    
    <!-- Right hexagon -->
    <path d="M 22 11 L 27 8 L 32 11 L 32 18 L 27 21 L 22 18 Z" stroke="#050990" stroke-width="1" fill="none"/>
    
    <!-- Center filled hexagon (yellow) -->
    <path d="M 14 8 L 18 6 L 22 8 L 22 14 L 18 16 L 14 14 Z" fill="#FFC107"/>
    
    <!-- Yellow accents -->
    <circle cx="12" cy="4" r="1.2" fill="#FFC107"/>
    <circle cx="5" cy="19" r="1.2" fill="#FFC107"/>
    <circle cx="29" cy="19" r="1.2" fill="#FFC107"/>
  </g>
  
  <!-- Company name - simplified -->
  <text x="50" y="20" font-family="'Noto Sans KR', sans-serif" font-size="13" font-weight="800" fill="#050990" letter-spacing="-0.3">더나은생활연구소</text>
</svg>
