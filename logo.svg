<svg width="120" height="50" viewBox="0 0 120 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hexagon symbol -->
  <g id="hexagons">
    <!-- Main center hexagon -->
    <path d="M 25 12 L 35 8 L 45 12 L 45 22 L 35 26 L 25 22 Z" stroke="#050990" stroke-width="1.5" fill="none"/>
    
    <!-- Left hexagon -->
    <path d="M 15 18 L 22 15 L 29 18 L 29 28 L 22 31 L 15 28 Z" stroke="#050990" stroke-width="1.5" fill="none"/>
    
    <!-- Right hexagon -->
    <path d="M 41 18 L 48 15 L 55 18 L 55 28 L 48 31 L 41 28 Z" stroke="#050990" stroke-width="1.5" fill="none"/>
    
    <!-- Center filled hexagon (yellow) -->
    <path d="M 28 15 L 35 12 L 42 15 L 42 22 L 35 25 L 28 22 Z" fill="#FFC107"/>
    
    <!-- Yellow accents (small circles) -->
    <circle cx="26" cy="10" r="2" fill="#FFC107"/>
    <circle cx="16" cy="30" r="2" fill="#FFC107"/>
    <circle cx="48" cy="30" r="2" fill="#FFC107"/>
  </g>
  
  <!-- Company name -->
  <text x="62" y="32" font-family="'Noto Sans KR', sans-serif" font-size="16" font-weight="900" fill="#000000">더나은생활연구소</text>
  
  <!-- SINCE 2018 -->
  <text x="62" y="46" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="#888888" letter-spacing="1">SINCE2018</text>
</svg>
