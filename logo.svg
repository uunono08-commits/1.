<svg width="280" height="80" viewBox="0 0 280 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hexagon structure with blue and yellow colors -->
  <g id="hexagon-logo">
    <!-- Main hexagon outline (blue) -->
    <path d="M 30 20 L 50 10 L 70 20 L 70 40 L 50 50 L 30 40 Z" stroke="#050990" stroke-width="2" fill="none"/>
    
    <!-- Left hexagon -->
    <path d="M 15 30 L 25 25 L 35 30 L 35 45 L 25 50 L 15 45 Z" stroke="#050990" stroke-width="2" fill="none"/>
    
    <!-- Right hexagon -->
    <path d="M 50 30 L 60 25 L 70 30 L 70 45 L 60 50 L 50 45 Z" stroke="#050990" stroke-width="2" fill="none"/>
    
    <!-- Center filled hexagon (yellow) -->
    <path d="M 35 28 L 45 23 L 55 28 L 55 38 L 45 43 L 35 38 Z" fill="#FFC107"/>
    
    <!-- Top-left yellow accent -->
    <circle cx="32" cy="18" r="4" fill="#FFC107"/>
    
    <!-- Bottom-left yellow accent -->
    <circle cx="22" cy="52" r="4" fill="#FFC107"/>
    
    <!-- Bottom-right yellow accent -->
    <circle cx="62" cy="52" r="4" fill="#FFC107"/>
  </g>
  
  <!-- Text: "더나은생활연구소" -->
  <text x="90" y="52" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="28" font-weight="900" fill="#000000" letter-spacing="-0.5">더나은생활연구소</text>
  
  <!-- Subtext: "SINCE 2018" -->
  <text x="30" y="72" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#888888" letter-spacing="2">SINCE 2018</text>
</svg>
